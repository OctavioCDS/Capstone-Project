{% extends 'base/padre.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'styles/index.css' %}">
<style>
  /* ==== LAYOUT GENERAL ESCÁNER ==== */
  .scanner-wrap {
    width: min(1280px, 96vw);
    margin: 90px auto 2.5rem auto;   /* margen superior base (desktop) */
    padding-inline: 0.75rem;
  }

  .scanner-card .card-body {
    padding: 1.25rem 1.5rem;
  }

  /* Botón principal de escaneo */
  #btnScan {
    font-size: 1.25rem;
    padding: .9rem 1.25rem;
  }

  /* Video / snapshot */
  #snapshotCanvas {
    display: none;
  }
  #snapshotThumb {
    max-width: 100%;
    border-radius: .5rem;
    display: none;
  }

  /* ====== MÓVIL ====== */
  @media (max-width: 768px) {
    .scanner-wrap {
      margin-top: 250px;        /* 🔥 separa bien del navbar fijo */
      padding-inline: 0.5rem;
    }

    .scanner-card .card-body {
      padding: 1rem;
    }

    /* Título y botón atrás se apilan mejor */
    .scanner-header {
      flex-direction: column;
      align-items: stretch;
      gap: .5rem;
      text-align: center;
    }

    .scanner-header h3 {
      font-size: 1.1rem;
    }

    .scanner-header .btn-back {
      align-self: flex-start;
    }

    /* Botones en columna y ocupando todo el ancho */
    .scanner-actions button,
    .scanner-actions a {
      width: 100%;
    }
  }

  /* Desktop: un poco más de padding */
  @media (min-width: 768px) {
    .scanner-card .card-body {
      padding: 1.5rem 2rem;
    }

    #btnScan {
      min-width: 280px;
    }
  }
</style>
{% endblock %}

{% block contenido %}
<div class="scanner-wrap">
  <!-- Header: botón atrás + título centrado -->
  <div class="d-flex justify-content-between align-items-center mb-3 scanner-header">
    <!-- Ir a la vista principal (home) -->
    <a href="/" class="btn btn-outline-secondary btn-back">← Atrás</a>

    <h3 class="mb-0 text-center flex-grow-1">Escaneo de QR / Cédula</h3>

    <!-- espacio para balancear el flex en desktop -->
    <div style="width: 220px;"></div>
  </div>

  <div class="card shadow-sm scanner-card">
    <div class="card-body">
      <div class="row g-3 align-items-start">
        <!-- LADO IZQUIERDO: VIDEO -->
        <div class="col-12 col-lg-7 d-flex flex-column align-items-center">
          <div class="w-100" style="max-width:720px;">
            <video id="preview"
                   class="border rounded w-100"
                   style="min-height: 380px; background:#000;"
                   playsinline></video>
          </div>
          <canvas id="snapshotCanvas" width="1280" height="720"></canvas>
          <img id="snapshotThumb" alt="Vista previa">
        </div>

        <!-- LADO DERECHO: CONTROLES -->
        <div class="col-12 col-lg-5">
          <div class="mb-2">
            <label class="form-label">Cámara</label>
            <select id="camera-select" class="form-select">
              <option value="">— Selecciona —</option>
            </select>
          </div>

          <div class="d-grid gap-2 mb-2 scanner-actions">
            <button id="btnScan" class="btn btn-primary btn-lg">Escanear</button>
            <button id="btnSnapshot" class="btn btn-outline-primary">Tomar foto (OCR)</button>
            <button id="btnStop" class="btn btn-outline-secondary">Detener</button>
          </div>

          <div id="result"
               class="alert alert-secondary mb-0"
               role="alert"
               style="min-height: 44px;">
            Cámara lista. Apunta al QR/Carnet.
          </div>

          <hr>

          <a href="{% url 'visitas_list' %}"
             class="btn btn-outline-dark w-100 mt-2">
            📋 Ir al listado
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal de confirmación -->
<div class="modal fade" id="regModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar ingreso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <form id="regForm" autocomplete="off">
          <div class="mb-2">
            <label class="form-label">RUT</label>
            <input id="fRut" name="rut" class="form-control" readonly>
          </div>
          <div class="mb-2">
            <label class="form-label">Nombre</label>
            <input id="fNombre" name="nombre" class="form-control" placeholder="Nombre del visitante">
          </div>
          <div class="mb-2">
            <label class="form-label">Fecha y hora</label>
            <input id="fFecha" name="fecha_hora" class="form-control" readonly>
          </div>
          <div class="mb-2">
            <label class="form-label">Lugar de destino</label>
            <select id="fDestino" name="destino_id" class="form-select">
              <option value="">— Selecciona —</option>
              {% for d in destinos %}
                <option value="{{ d.id_lugar }}">{{ d.nombre_lugar }}</option>
              {% endfor %}
            </select>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button id="btnCancel" type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnRegistrar" type="button" class="btn btn-primary">Registrar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<script src="https://unpkg.com/tesseract.js@v5/dist/tesseract.min.js"></script>

<script src="{% static 'js/scanner.v5.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initScanner({
      apiUrl: "{% url 'scan_api' %}",
      csrfToken: "{{ csrf_token }}",
      autoStart: true,
      ocrLang: "eng,spa"
    });
  });
</script>
{% endblock %}
